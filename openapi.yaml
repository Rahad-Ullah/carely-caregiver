openapi: 3.0.3

info:
  title: Carely API
  version: 1.0.0
  description: API documentation for Carely Express application

servers:
  - url: http://localhost:5000
    description: Local development server

components:
  schemas:
    User:
      type: object

      properties:
        id:
          type: string
          example: 66b0a123456789abcdef1234

        name:
          type: string
          example: John Doe

        email:
          type: string
          format: email
          example: john@example.com

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Authentication

      summary: Login user

      description: |
        Authenticates a user using an email and password.
        Returns authentication tokens and the authenticated user.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - email
                - password

              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com

                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123

                fcmToken:
                  type: string
                  description: Firebase Cloud Messaging device token
                  example: firebase-device-token

      responses:
        "200":
          description: Login successful

          headers:
            Set-Cookie:
              description: Refresh token cookie set by the server
              schema:
                type: string

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Login successful

                  data:
                    type: object

                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIs...

                      refreshToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIs...

                      user:
                        $ref: "#/components/schemas/User"

        "400":
          description: Invalid request data

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: false

                  message:
                    type: string
                    example: Validation failed

        "401":
          description: Invalid credentials

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: false

                  message:
                    type: string
                    example: Invalid email or password
  /api/users:
    post:
      summary: Create a user
      description: Creates a new user.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - name
                - email

              properties:
                name:
                  type: string
                  example: John

                email:
                  type: string
                  format: email
                  example: john@example.com

      responses:
        "201":
          description: User created successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: User created successfully

                  data:
                    type: object

                    properties:
                      id:
                        type: integer
                        example: 1

                      name:
                        type: string
                        example: John

                      email:
                        type: string
                        format: email
                        example: john@example.com

        "400":
          description: Invalid request

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Name and email are required
